<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #4fd1c5; } a:hover { color: #7fe3d8; }
  </style>
</helmet>
<div style="width:390px;height:920px;background:#0b0b12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f2f2f7;display:flex;flex-direction:column;padding:20px 20px 26px;box-sizing:border-box;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="font-size:12px;font-weight:800;letter-spacing:1px;color:#9797a8;">RSL MUSIC JOURNEY</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:#4fd1c5;background:#16161f;border:1px solid #2a2a38;padding:5px 9px;border-radius:999px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#4fd1c5;"></span>OFFLINE
      </div>
      <div style="width:34px;height:34px;border-radius:10px;background:#16161f;border:1px solid #2a2a38;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#f2f2f7" stroke-width="2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="#f2f2f7" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

  <div style="margin-top:18px;">
    <div style="font-size:26px;font-weight:800;line-height:1.16;letter-spacing:-0.3px;">What kind of<br/>night do you want?</div>
  </div>

  <!-- taste module -->
  <div style="margin-top:18px;background:#16161f;border:1px solid #2a2a38;border-radius:18px;padding:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-size:11px;font-weight:800;letter-spacing:0.5px;color:#9797a8;">YOUR TASTE</div>
      <div style="font-size:12px;font-weight:700;color:#4fd1c5;">Edit →</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;">

      <div style="aspect-ratio:1/1;border-radius:14px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 20c8 0 13-5 13-14-9 0-13 5-13 14z" stroke="#ff6b35" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 18c2-4 5-7 9-10" stroke="#ff6b35" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div style="font-size:9.5px;font-weight:700;color:#f2f2f7;">Organic</div>
      </div>

      <div style="aspect-ratio:1/1;border-radius:14px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 12c3 0 3-4 0-4s-3 4 0 4-3 4 0 4 3-4 0-4 5-2 5 2-5 2-5 2" stroke="#ff6b35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-size:9.5px;font-weight:700;color:#f2f2f7;">Psychedelic</div>
      </div>

      <div style="aspect-ratio:1/1;border-radius:14px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v5l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3" stroke="#ff6b35" stroke-width="1.8" stroke-linejoin="round"/><circle cx="10.5" cy="15.5" r="0.9" fill="#ff6b35"/><circle cx="14" cy="17" r="0.7" fill="#ff6b35"/></svg>
        <div style="font-size:9.5px;font-weight:700;color:#f2f2f7;">Experimental</div>
      </div>

      <div style="aspect-ratio:1/1;border-radius:14px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#ff6b35" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5" stroke="#ff6b35" stroke-width="1.6"/><path d="M3.5 12h17" stroke="#ff6b35" stroke-width="1.6"/></svg>
        <div style="font-size:9.5px;font-weight:700;color:#f2f2f7;">Global</div>
      </div>

      <div style="aspect-ratio:1/1;border-radius:14px;background:#1a1a24;border:1px solid #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 10h3l5-4v12l-5-4H5v-4z" stroke="#9797a8" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9c1.3 1.3 1.3 4.7 0 6M19.3 6.7c2.6 2.6 2.6 8 0 10.6" stroke="#9797a8" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div style="font-size:9.5px;font-weight:600;color:#9797a8;">Bass</div>
      </div>

      <div style="aspect-ratio:1/1;border-radius:14px;background:#1a1a24;border:1px solid #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-6 8 6" stroke="#9797a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V20h12v-9.5" stroke="#9797a8" stroke-width="1.8" stroke-linejoin="round"/><path d="M18.5 8c1 1 1 3.2 0 4.2" stroke="#9797a8" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div style="font-size:9.5px;font-weight:600;color:#9797a8;">House</div>
      </div>

      <div style="aspect-ratio:1/1;border-radius:14px;background:#1a1a24;border:1px solid #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M13 2 5 14h5l-1 8 8-12h-5l1-8z" stroke="#9797a8" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <div style="font-size:9.5px;font-weight:600;color:#9797a8;">Techno</div>
      </div>

      <div style="aspect-ratio:1/1;border-radius:14px;background:#1a1a24;border:1px dashed #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
        <div style="font-size:16px;color:#5c5c6b;">+3</div>
        <div style="font-size:9px;color:#5c5c6b;">artists</div>
      </div>

    </div>
  </div>

  <!-- primary CTA -->
  <button style="margin-top:16px;border:none;border-radius:20px;padding:24px 20px;background:linear-gradient(135deg,#ff6b35,#c084fc);display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 30px -12px rgba(255,107,53,0.5);">
    <span style="font-size:18px;font-weight:800;color:#0b0b12;">BUILD MY NIGHT</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#0b0b12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div style="display:flex;gap:10px;margin-top:12px;">
    <button style="flex:1;background:#16161f;border:1px solid #2a2a38;border-radius:14px;padding:15px 8px;color:#f2f2f7;font-size:12.5px;font-weight:700;">WHAT'S GOOD NOW</button>
    <button style="flex:1;background:#16161f;border:1px solid #2a2a38;border-radius:14px;padding:15px 8px;color:#c084fc;font-size:12.5px;font-weight:700;">SURPRISE ME</button>
  </div>

  <div style="display:flex;gap:10px;margin-top:10px;">
    <button style="flex:1;background:none;border:1px solid #2a2a38;border-radius:14px;padding:12px 8px;color:#9797a8;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="#9797a8" stroke-width="1.8"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="#9797a8" stroke-width="1.8" stroke-linecap="round"/></svg>
      BROWSE ARTISTS
    </button>
    <button style="flex:1;background:none;border:1px solid #2a2a38;border-radius:14px;padding:12px 8px;color:#9797a8;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l3 3v15l-6-3.5L6 21V3z" stroke="#9797a8" stroke-width="1.8" stroke-linejoin="round"/></svg>
      SAVED
    </button>
  </div>

  <div style="flex:1;"></div>
  <div style="text-align:center;font-size:10.5px;color:#5c5c6b;">1,180 artists · works fully offline</div>
</div>
</x-dc>
</body>
</html>
