<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #4fd1c5; } a:hover { color: #7fe3d8; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0b12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f2f2f7;display:flex;flex-direction:column;padding:22px 22px 26px;box-sizing:border-box;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="width:36px;height:36px;border-radius:11px;background:#16161f;border:1px solid #2a2a38;display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#f2f2f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="display:flex;gap:6px;">
      <span style="width:22px;height:4px;border-radius:2px;background:#ff6b35;"></span>
      <span style="width:22px;height:4px;border-radius:2px;background:#2a2a38;"></span>
    </div>
    <div style="width:36px;"></div>
  </div>

  <div style="font-size:25px;font-weight:800;margin-top:20px;line-height:1.2;">What are you<br/>feeling tonight?</div>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:20px;">

    <div style="aspect-ratio:1/1;border-radius:16px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;">🌿</div>
      <div style="font-size:10.5px;font-weight:700;color:#f2f2f7;">Organic</div>
    </div>

    <div style="aspect-ratio:1/1;border-radius:16px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;">🌀</div>
      <div style="font-size:10.5px;font-weight:700;color:#f2f2f7;">Psychedelic</div>
    </div>

    <div style="aspect-ratio:1/1;border-radius:16px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;">🌌</div>
      <div style="font-size:10.5px;font-weight:700;color:#f2f2f7;">Experimental</div>
    </div>

    <div style="aspect-ratio:1/1;border-radius:16px;background:rgba(255,107,53,0.14);border:1.5px solid #ff6b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;">🌍</div>
      <div style="font-size:10.5px;font-weight:700;color:#f2f2f7;">Global</div>
    </div>

    <div style="aspect-ratio:1/1;border-radius:16px;background:#16161f;border:1px solid #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;opacity:0.7;">🔊</div>
      <div style="font-size:10.5px;font-weight:600;color:#9797a8;">Bass</div>
    </div>

    <div style="aspect-ratio:1/1;border-radius:16px;background:#16161f;border:1px solid #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;opacity:0.7;">🎛</div>
      <div style="font-size:10.5px;font-weight:600;color:#9797a8;">House</div>
    </div>

    <div style="aspect-ratio:1/1;border-radius:16px;background:#16161f;border:1px solid #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;opacity:0.7;">⚡</div>
      <div style="font-size:10.5px;font-weight:600;color:#9797a8;">Techno</div>
    </div>

    <div style="aspect-ratio:1/1;border-radius:16px;background:#16161f;border:1px solid #2a2a38;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;">
      <div style="font-size:22px;opacity:0.7;">🎸</div>
      <div style="font-size:10.5px;font-weight:600;color:#9797a8;">Live</div>
    </div>

  </div>

  <div style="margin-top:22px;">
    <div style="font-size:12px;font-weight:800;color:#9797a8;letter-spacing:0.4px;margin-bottom:10px;">FAVORITE ARTISTS <span style="font-weight:500;color:#5c5c6b;">(optional)</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      <div style="background:#16161f;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;color:#f2f2f7;">Bonobo</div>
      <div style="background:#16161f;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;color:#f2f2f7;">The Polish Ambassador</div>
      <div style="background:#16161f;border:1px solid #2a2a38;border-radius:999px;padding:8px 14px;font-size:13px;color:#f2f2f7;">Govinda</div>
      <div style="background:transparent;border:1px dashed #4fd1c5;border-radius:999px;padding:8px 14px;font-size:13px;color:#4fd1c5;font-weight:700;">+ add</div>
    </div>
  </div>

  <div style="margin-top:22px;">
    <div style="font-size:12px;font-weight:800;color:#9797a8;letter-spacing:0.4px;margin-bottom:10px;">HOW DO YOU LIKE IT PLAYED?</div>
    <div style="display:flex;gap:8px;">
      <div style="flex:1;text-align:center;background:#16161f;border:1px solid #2a2a38;border-radius:12px;padding:13px 6px;font-size:13px;font-weight:700;color:#9797a8;">DJ</div>
      <div style="flex:1;text-align:center;background:rgba(79,209,197,0.14);border:1.5px solid #4fd1c5;border-radius:12px;padding:13px 6px;font-size:13px;font-weight:700;color:#4fd1c5;">LIVE</div>
      <div style="flex:1;text-align:center;background:rgba(79,209,197,0.14);border:1.5px solid #4fd1c5;border-radius:12px;padding:13px 6px;font-size:13px;font-weight:700;color:#4fd1c5;">HYBRID</div>
    </div>
  </div>

  <div style="flex:1;"></div>

  <button style="border:none;border-radius:16px;padding:19px;background:#ff6b35;color:#0b0b12;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
    NEXT
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#0b0b12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
</x-dc>
</body>
</html>
