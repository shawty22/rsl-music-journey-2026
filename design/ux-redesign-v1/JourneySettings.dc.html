<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #4fd1c5; } a:hover { color: #7fe3d8; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0b12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f2f2f7;display:flex;flex-direction:column;padding:22px 22px 26px;box-sizing:border-box;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="width:36px;height:36px;border-radius:11px;background:#16161f;border:1px solid #2a2a38;display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#f2f2f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="display:flex;gap:6px;">
      <span style="width:22px;height:4px;border-radius:2px;background:#ff6b35;"></span>
      <span style="width:22px;height:4px;border-radius:2px;background:#ff6b35;"></span>
    </div>
    <div style="width:36px;"></div>
  </div>

  <div style="margin-top:28px;">
    <div style="font-size:22px;font-weight:800;line-height:1.25;">How far down the<br/>rabbit hole?</div>
    <div style="display:flex;justify-content:space-between;margin-top:22px;margin-bottom:10px;font-size:11px;font-weight:700;color:#5c5c6b;letter-spacing:0.3px;">
      <span>FAMILIAR</span>
      <span style="color:#c084fc;">ADVENTUROUS</span>
    </div>
    <div style="position:relative;height:22px;">
      <div style="position:absolute;top:9px;left:0;right:0;height:4px;border-radius:2px;background:#2a2a38;"></div>
      <div style="position:absolute;top:9px;left:0;width:82%;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff6b35,#c084fc);"></div>
      <div style="position:absolute;top:1px;left:calc(82% - 10px);width:20px;height:20px;border-radius:50%;background:#f2f2f7;border:4px solid #c084fc;box-shadow:0 0 0 6px rgba(192,132,252,0.18);"></div>
    </div>
  </div>

  <div style="margin-top:34px;">
    <div style="font-size:22px;font-weight:800;line-height:1.25;">How long have<br/>you got?</div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <div style="flex:1;text-align:center;background:#16161f;border:1px solid #2a2a38;border-radius:14px;padding:15px 4px;font-size:14px;font-weight:700;color:#9797a8;">2h</div>
      <div style="flex:1;text-align:center;background:#16161f;border:1px solid #2a2a38;border-radius:14px;padding:15px 4px;font-size:14px;font-weight:700;color:#9797a8;">3h</div>
      <div style="flex:1;text-align:center;background:#ff6b35;border:1.5px solid #ff6b35;border-radius:14px;padding:15px 4px;font-size:14px;font-weight:800;color:#0b0b12;">4h</div>
      <div style="flex:1;text-align:center;background:#16161f;border:1px solid #2a2a38;border-radius:14px;padding:15px 4px;font-size:14px;font-weight:700;color:#9797a8;">6h+</div>
    </div>
  </div>

  <div style="margin-top:34px;">
    <div style="font-size:22px;font-weight:800;line-height:1.25;">Where are you<br/>starting?</div>
    <div style="display:flex;align-items:center;gap:10px;background:#16161f;border:1px solid #2a2a38;border-radius:14px;padding:16px;margin-top:16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><path d="M12 21s-7-7.5-7-12a7 7 0 1 1 14 0c0 4.5-7 12-7 12z" stroke="#ff6b35" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.4" stroke="#ff6b35" stroke-width="2"/></svg>
      <span style="font-size:17px;font-weight:700;">7:15 &amp; B</span>
    </div>
    <div style="font-size:12px;color:#5c5c6b;margin-top:8px;">Nearest intersection — that's close enough.</div>
  </div>

  <div style="flex:1;"></div>

  <button style="border:none;border-radius:20px;padding:24px 22px;background:linear-gradient(135deg,#ff6b35,#c084fc);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 34px -14px rgba(192,132,252,0.5);cursor:pointer;">
    <span style="font-size:19px;font-weight:800;color:#0b0b12;letter-spacing:0.3px;">TAKE ME SOMEWHERE</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#0b0b12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
</x-dc>
</body>
</html>
